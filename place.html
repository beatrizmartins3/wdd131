<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Weather </title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals – Beatriz Martins - 
    Place Weather Page">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <meta name="author" content="Beatriz Martins">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script defer src="scripts/place.js"></script>
</head>
<body>
    <header>
        <h1>Piauí</h1>
    </header>
    <main>
         <div class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width:1000px )" >
                <source media="(min-width: 500px )" srcset="images/hero-medium.webp">
                <img src="images/hero-small.webp" alt="Piauí" width="500" height="250">
            </picture>
        </div>
        <section class="data">
            <h2>Data</h2>
            <p><b>Area: </b>251.755,499 km²</p>
            <p><b>Population: </b>3.392.617</p>
            <p><b>Capital: </b>Teresina</p>
            <p><b>Languages: </b>Portuguese</p>
            <p><b>Currency: </b>Real</p>
            <p><b>Time Zone: </b>GMT-3</p>
            <p><b>Calling Code: </b>86</p>
            <p><b>Internet TLD: </b>.br</p>
        </section>
        <section class="weather">
            <h2>Weather</h2> 
            <img class="icon" src="images/icon.svg" alt="Weather icon">
            
            <p><b>Temperature: </b><span id="temperature"></span>°C</p>
            <p><b>Conditions: </b><span id="conditions"></span></p>
            <p><b>Wind: </b><span id="wind" ></span> km/h</p>
            <p><b>Wind Chill: </b><span id="wind-chill"></span></p>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Beatriz Martins - Brazil</p>
        <p>Last Modified: <span id="lastmodified"></span></p>
    </footer>
</body>
</html>
